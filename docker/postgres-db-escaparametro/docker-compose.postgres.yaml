services:
  db:
    image: postgres:18
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: a
      POSTGRES_USER: ico
      POSTGRES_DB: escaparametro
    #healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U prisma -d postgres"]
    #   interval: 5s
    #   timeout: 2s
    #   retries: 20
    #command: postgres -c listen_addresses='*'
    #logging:
    #  options:
    #    max-size: "10m"
    #    max-file: "3"
    volumes:
      - qracer_data:/var/lib/postgresql/18/docker
    ports:
      - 5432:5432
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  qracer_data:
