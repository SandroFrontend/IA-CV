services:
  ollama:
    image: ollama/ollama:latest
    container_name: escaparometro_ollama
    restart: unless-stopped
    dns:
     - 1.1.1.1
     - 8.8.8.8
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_storage: